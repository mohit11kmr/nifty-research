proposal:
  proposal_id: example_ai_proposal_0001
  title: "EXAMPLE ONLY - RANGE_HV condor research hypothesis (NOT FOR TRADING)"
  author_type: AI
  author_model: big-pickle
  created_at: "2026-08-15T10:00:00+05:30"
  parent_strategy_id: range_hv_iron_condor_v1
  hypothesis: >
    EXAMPLE ONLY. RANGE_HV days with 16<=VIX<25 offer a defined-risk credit
    collection edge because mean reversion inside the band makes an iron
    condor more likely to reach its 50% target than its 2x stop.
  research_question: >
    EXAMPLE ONLY. Is an iron condor entered only on RANGE_HV days with
    16<=VIX<25, sized 1 lot, closed at target/stop/time/canonical expiry,
    economically positive AFTER the canonical cost model?
  expected_failure_modes:
    - "EXAMPLE ONLY: VIX gate misclassifies; regime flips after entry"
    - "EXAMPLE ONLY: wings too close; credit does not cover tail risk"
    - "EXAMPLE ONLY: n too small to distinguish edge from luck"
    - "EXAMPLE ONLY: fees + slippage consume the collected premium"

strategy:
  schema_version: "1.0"

  strategy:
    id: range_hv_iron_condor_v1
    name: RANGE-HV Iron Condor (premium_seller structure)
    version: 1
    classification: EXAMPLE_ONLY

  description: >
    EXAMPLE ONLY / NOT FOR TRADING. Declarative re-statement of the frozen
    range_hv_iron_condor_v1 candidate so the Phase I research layer can prove
    the proposal->spec->backtest->compare pipeline end to end.

  market:
    underlying: NIFTY

  regime:
    allowed:
      - RANGE_HV

  entry:
    conditions:
      all:
        - id: regime_range_hv
          field: REGIME
          operator: "=="
          value: RANGE_HV
        - id: vix_floor
          field: VIX
          operator: ">="
          value: 16.0
        - id: vix_ceiling
          field: VIX
          operator: "<"
          value: 25.0
        - id: structure
          rule: EXISTING_PROJECT_RULE
          project_ref: premium_seller.sell_ok

  direction:
    mode: NEUTRAL

  instrument:
    type: DEFINED_RISK_RANGE
    option_side: [CE, PE]
    lot_size: 75

  strike_selection:
    rule: EXISTING_PROJECT_RULE
    project_ref: multi_strategy_backtest.build_condor
    note: >
      short call = round(spot*1.02/50)*50; short put = round(spot*0.98/50)*50;
      wings nearest listed strike to +/-150 pts. Skip if any leg unlisted or
      credit <= 0.

  risk:
    rule: EXISTING_PROJECT_RULE
    project_ref: multi_strategy_backtest.simulate_condor
    capital_basis: 100000
    position_size:
      lots: 1
      lot_size: 75
    max_risk_pct: 1.0
    note: >
      Defined risk. Maximum loss = wing width (150 pts) - net credit; entry
      credit from chain LTP. 8 orders round-trip, slippage 1.5% adverse/fill.

  exit:
    stop:
      rule: EXISTING_PROJECT_RULE
      project_ref: multi_strategy_backtest.simulate_condor
    target:
      rule: EXISTING_PROJECT_RULE
      project_ref: multi_strategy_backtest.simulate_condor
    expiry:
      rule: CANONICAL_EXPIRY
    allowed_reasons: [TARGET, STOP, TIME, EXPIRY, EOD]

  execution:
    cost_model: {cost_per_order: 40.0, orders_per_round_trip: 8}
    slippage_pct: 0.015

  data_requirements:
    - NIFTY
    - VIX
    - OPTIONS
    - OI
    - EXPIRY_CALENDAR

  state:
    lifecycle: DRAFT
    classification: EXAMPLE_ONLY
    promoted: false

  references:
    parent_strategy: range_hv_iron_condor_v1
    note: EXAMPLE ONLY / NOT FOR TRADING - proves the research pipeline only.

